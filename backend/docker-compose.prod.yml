# Production Docker Compose — includes PostgreSQL + API
# Usage:
#   cp .env.prod.example .env.prod   # then edit values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Create admin user after first boot:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm \
#     --entrypoint node api dist/scripts/create-admin.js

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${POSTGRES_CPU_LIMIT:-0.75}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-market}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tuned for 1 vCore / 2GB RAM VPS — Docker-native -c flags.
    # See postgres/postgresql.conf for the full parameter reference and memory budget.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_buffers=4MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market} -d ${POSTGRES_DB:-market}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Do not expose PostgreSQL port to the host in production.
    # If you need direct access for debugging, uncomment:
    # ports:
    #   - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    cpus: ${API_CPU_LIMIT:-0.75}
    pids_limit: ${API_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env.prod
    environment:
      # Connect to the postgres service by service name (no host.docker.internal needed).
      # connection_limit=8 caps the Prisma pool for a 2GB VPS (PG max_connections=50).
      # pool_timeout=20s prevents indefinite hangs if the pool is exhausted.
      DATABASE_URL: postgresql://${POSTGRES_USER:-market}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-market}?schema=public&connection_limit=8&pool_timeout=20
      STORAGE_DIR: /app/storage
    ports:
      # Bind to localhost only — Nginx (on host) handles external traffic.
      # If not using Nginx, change to "${API_PORT:-4000}:4000" to expose publicly.
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - "${HOST_STORAGE_DIR:-./storage}:/app/storage"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
