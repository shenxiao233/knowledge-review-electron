# ──────────────────────────────────────────────
# Nginx reverse proxy for knowledge-review-electron backend
# Optimized for 1 vCore / 2GB RAM VPS with 250MB uploads
#
# Installation (on host):
#   sudo apt install nginx
#   sudo cp nginx.conf /etc/nginx/sites-available/market-api
#   sudo ln -s /etc/nginx/sites-available/market-api /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, run after DNS is configured:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.your-domain.com
# ──────────────────────────────────────────────

# Worker config tuned for 1 vCore
worker_processes auto;
worker_rlimit_nofile 2048;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ── Basics ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    server_tokens off;

    # ── MIME ──
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Client body limits (250MB max upload + headroom) ──
    client_max_body_size 260m;
    client_body_buffer_size 1m;
    client_body_timeout 300s;
    client_header_timeout 30s;

    # ── Gzip (complements Fastify's own gzip) ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Log format ──
    log_format main '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time uct=$upstream_connect_time '
                     'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/market-api.access.log main;
    error_log /var/log/nginx/market-api.error.log warn;

    # ── Upstream to Fastify backend ──
    upstream market_api {
        server 127.0.0.1:4000;
        keepalive 16;
    }

    # ── Rate limiting at Nginx level (defense in depth) ──
    # Limits per-IP request rate; complements Fastify's app-level rate limiter.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req zone=api_limit burst=40 nodelay;

    server {
        listen 80;
        server_name _;

        # Certbot will add the 443 server block automatically after running:
        #   sudo certbot --nginx -d api.your-domain.com

        # ── Proxy to Fastify ──
        location / {
            proxy_pass http://market_api;

            # ── Headers for TRUST_PROXY ──
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ── Timeouts (generous for large uploads/downloads) ──
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # ── Buffering: receive full request before forwarding to backend ──
            # This frees the Node.js event loop from slow clients uploading 250MB.
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;

            # ── Keepalive to upstream (reuse TCP connections) ──
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # ── Temp file path for large request buffering ──
            proxy_temp_file_write_size 32k;
        }

        # ── Health check passthrough (no rate limiting) ──
        location = /health {
            proxy_pass http://market_api;
            proxy_set_header Host $host;
            access_log off;
            limit_req off;
        }

        # ── Let's Encrypt challenge (for certbot) ──
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
