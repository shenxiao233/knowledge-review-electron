# ──────────────────────────────────────────────
# PostgreSQL tuning for 1 vCore / 2GB RAM VPS
#
# This file overrides PostgreSQL defaults that are tuned for
# much larger machines. Mount it via docker-compose.prod.yml:
#
#   volumes:
#     - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
#   command: postgres -c config_file=/etc/postgresql/postgresql.conf
#
# Memory budget (2GB total):
#   PostgreSQL:  ~350MB (shared_buffers + work_mem × connections + overhead)
#   Node.js API: ~250MB
#   Nginx:       ~20MB
#   OS + buffers:~400MB
#   Headroom:    ~980MB for actual query/page cache work
# ──────────────────────────────────────────────

# ── Connections ──
# 50 max connections is plenty for a single API process with Prisma
# connection_limit=8. Leaves room for migrations + admin queries.
max_connections = 50

# ── Memory ──
# shared_buffers: PostgreSQL's own cache. 256MB ≈ 12.5% of 2GB.
shared_buffers = 256MB
# effective_cache_size: hint to query planner about total OS+PG cache.
# Set to ~50% of RAM; OS page cache supplements shared_buffers.
effective_cache_size = 512MB
# work_mem: per-sort/hash memory. Keep low with 50 connections.
# 50 conns × 2MB = 100MB worst case, well within budget.
work_mem = 2MB
# maintenance_work_mem: for VACUUM/CREATE INDEX. Low priority on small VPS.
maintenance_work_mem = 64MB

# ── WAL / Checkpoints ──
# Larger WAL buffers reduce checkpoint I/O spikes.
wal_buffers = 4MB
checkpoint_completion_target = 0.9
max_wal_size = 512MB
min_wal_size = 64MB

# ── Query planner ──
random_page_cost = 1.1
effective_io_concurrency = 200

# ── Logging (lightweight, for debugging slow queries) ──
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_disconnections = off

# ── Autovacuum (keep enabled, default is fine) ──
autovacuum = on
autovacuum_max_workers = 2
